<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Everydaypane">
  <!-- Small-size mark: same three panes and clock as mark.svg, tuned so 16–32 px tabs still read. -->
  <defs>
    <linearGradient id="ep-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b7bff"/>
      <stop offset="1" stop-color="#2a3796"/>
    </linearGradient>
    <linearGradient id="ep-sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd76a"/>
      <stop offset="1" stop-color="#ff9f43"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7.5" fill="url(#ep-bg)"/>
  <rect x="5" y="5" width="13" height="22" rx="3.5" fill="#fff"/>
  <path d="M11.5 11v5.2l3.2 2.1" fill="none" stroke="#2a3796" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="20" y="5" width="7" height="10" rx="2.5" fill="url(#ep-sun)"/>
  <rect x="20" y="17" width="7" height="10" rx="2.5" fill="#fff" fill-opacity=".72"/>
</svg>
