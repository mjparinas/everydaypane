<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Made-up cover for the preview's sample track ("Westward" by The Harbour Lights), not a real album. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1b5a"/>
      <stop offset="0.45" stop-color="#c2410c"/>
      <stop offset="0.7" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a5f"/>
      <stop offset="1" stop-color="#0b1730"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7d6"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <circle cx="256" cy="318" r="96" fill="url(#sun)"/>
  <path d="M0 300 L70 250 L130 280 L200 230 L260 270 L330 220 L410 262 L470 240 L512 255 L512 318 L0 318 Z" fill="#3b1f4a" opacity="0.85"/>
  <rect y="318" width="512" height="194" fill="url(#sea)"/>
