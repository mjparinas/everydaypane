    <line x1="196" y1="340" x2="316" y2="340" stroke-width="6"/>
    <line x1="214" y1="364" x2="298" y2="364" stroke-width="5"/>
    <line x1="230" y1="388" x2="282" y2="388" stroke-width="4"/>
    <line x1="242" y1="410" x2="270" y2="410" stroke-width="3"/>
  </g>
  <text x="256" y="84" text-anchor="middle" font-family="Georgia,serif" font-size="46" font-style="italic" fill="#fff7ed">Westward</text>
  <text x="256" y="116" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" letter-spacing="3" fill="#fde68a">THE HARBOUR LIGHTS</text>
