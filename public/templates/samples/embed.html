<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: system-ui, sans-serif;
        background: linear-gradient(145deg, #0f172a, #1e293b 55%, #334155);
        color: #e2e8f0;
        display: grid;
        place-items: center;
      }
      .card {
        text-align: center;
        padding: 1.5rem;
      }
      .label {
        font-size: 0.75rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        opacity: 0.7;
      }
      .title {
        margin-top: 0.5rem;
        font-size: 1.35rem;
        font-weight: 700;
      }
      .sub {
        margin-top: 0.35rem;
        font-size: 0.9rem;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="label">Sample embed</div>
      <div class="title" id="t">Everydaypane</div>
      <div class="sub">Offline preview stand-in</div>
    </div>
    <script>
      const q = new URLSearchParams(location.search);
      const host = location.hostname.replace(/^www\./, "");
      document.getElementById("t").textContent = q.get("label") || host || "Embed";
    </script>
  </body>
</html>
