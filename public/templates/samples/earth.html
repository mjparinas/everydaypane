<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(circle at 40% 35%, #1e3a5f, #061018 70%);
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script>
      const c = document.getElementById("c");
      const ctx = c.getContext("2d");
      const particles = Array.from({ length: 180 }, () => ({
        a: Math.random() * Math.PI * 2,
        r: 0.35 + Math.random() * 0.55,
        s: 0.002 + Math.random() * 0.006,
      }));
      function resize() {
        c.width = innerWidth * devicePixelRatio;
        c.height = innerHeight * devicePixelRatio;
      }
      addEventListener("resize", resize);
      resize();
      function frame() {
        const w = c.width;
        const h = c.height;
        const cx = w * 0.5;
        const cy = h * 0.48;
        const R = Math.min(w, h) * 0.36;
        ctx.clearRect(0, 0, w, h);
        const g = ctx.createRadialGradient(cx - R * 0.3, cy - R * 0.3, R * 0.2, cx, cy, R);
        g.addColorStop(0, "#3b82f6");
        g.addColorStop(0.55, "#1d4ed8");
        g.addColorStop(1, "#0b1c33");
        ctx.beginPath();
        ctx.arc(cx, cy, R, 0, Math.PI * 2);
        ctx.fillStyle = g;
        ctx.fill();
        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy, R, 0, Math.PI * 2);
        ctx.clip();
        for (const p of particles) {
          p.a += p.s;
          const x = cx + Math.cos(p.a) * R * p.r;
          const y = cy + Math.sin(p.a * 1.3) * R * p.r * 0.7;
          ctx.strokeStyle = "rgba(226,232,240,0.45)";
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x + Math.cos(p.a + 1) * 14, y + Math.sin(p.a + 1) * 8);
          ctx.stroke();
        }
        ctx.restore();
        ctx.beginPath();
        ctx.arc(cx + R * 0.18, cy - R * 0.05, 5 * devicePixelRatio, 0, Math.PI * 2);
        ctx.fillStyle = "#f8fafc";
        ctx.fill();
        requestAnimationFrame(frame);
      }
      frame();
    </script>
  </body>
</html>
