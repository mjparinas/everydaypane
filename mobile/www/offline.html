<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Everydaypane</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f7fb;
        --ink: #151a2d;
        --soft: #5b6478;
        --brand: #3b5bdb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #10131c;
          --ink: #eef0f7;
          --soft: #a3abc0;
        }
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--ink);
        font:
          17px/1.45 -apple-system,
          system-ui,
          sans-serif;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 8px;
      }
      p {
        color: var(--soft);
        margin: 0 0 20px;
      }
      button {
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: var(--brand);
        border: 0;
        border-radius: 12px;
        padding: 12px 22px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Can't Reach Everydaypane</h1>
      <p>Check the Wi-Fi or mobile data, then try again.</p>
      <button type="button" onclick="location.replace('https://www.everydaypane.com/app/')">Try Again</button>
    </main>
  </body>
</html>
