name: CI

# Everything runs in parallel; "CI passed" is the one check to require in branch protection, and it is green
# only when every other job is. Vercel deploys main through its Git integration, so a merge is a release.
# Markdown-only changes still run this workflow so the required check reports, but the heavy jobs are skipped
# (Melvin, 2026-11-23: document changes shouldn't trigger CI tests).

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request cancels its stale run, but every commit on main gets its own full run: merges land
# minutes apart, and a cancelled run left those merge commits on main without a "CI passed".
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  changes:
    name: Change filter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        name: Skip suite when only markdown changed
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            # First push on a new ref has no useful before; run the suite.
            if [ "$base" = "0000000000000000000000000000000000000000" ]; then
              echo "code=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          files="$(git diff --name-only "$base" "$head")"
          if [ -z "$files" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Any non-.md path means run types, tests and the build.
          if printf '%s\n' "$files" | grep -qvE '\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Markdown-only change; skipping heavy CI jobs."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  static:
    name: Types, lint and audit
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Types
        run: npx tsc --noEmit
      - name: Lint
        if: ${{ !cancelled() }}
        run: npx eslint --max-warnings 0
      - name: Formatting
        if: ${{ !cancelled() }}
        run: npx prettier --check .
      # Production dependencies ship to the display, so they gate the build; dev tooling is reported only.
      - name: Dependency audit
        if: ${{ !cancelled() }}
        run: npm audit --omit=dev --audit-level=high
      - if: ${{ !cancelled() }}
        run: npm audit --audit-level=high
        continue-on-error: true

  unit:
    name: Unit tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npx vitest run --coverage

  build:
    name: Build and browser tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run build
        env:
          SESSION_SECRET: ci-only-session-secret-0123456789abcdef
      - name: Display bundle budget
        run: node scripts/bundle-check.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: node scripts/e2e.mjs
        env:
          SESSION_SECRET: ci-only-session-secret-0123456789abcdef
          ADMIN_PASSWORD: ci-only-admin-password
          DATABASE_URL: file:ci.db

  passed:
    name: CI passed
    if: always()
    needs: [changes, static, unit, build]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
