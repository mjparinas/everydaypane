name: CI

# Everything runs in parallel; "CI passed" is the one check to require in branch protection, and it is green
# only when every other job is. Vercel deploys main through its Git integration, so a merge is a release.

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request cancels its stale run, but every commit on main gets its own full run: merges land
# minutes apart, and a cancelled run left those merge commits on main without a "CI passed".
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  static:
    name: Types, lint and audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Types
        run: npx tsc --noEmit
      - name: Lint
        if: ${{ !cancelled() }}
        run: npx eslint --max-warnings 0
      - name: Formatting
        if: ${{ !cancelled() }}
        run: npx prettier --check .
      # Production dependencies ship to the display, so they gate the build; dev tooling is reported only.
      - name: Dependency audit
        if: ${{ !cancelled() }}
        run: npm audit --omit=dev --audit-level=high
      - if: ${{ !cancelled() }}
        run: npm audit --audit-level=high
        continue-on-error: true

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npx vitest run --coverage

  build:
    name: Build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: npm run build
        env:
          SESSION_SECRET: ci-only-session-secret-0123456789abcdef
      - name: Display bundle budget
        run: node scripts/bundle-check.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: node scripts/e2e.mjs
        env:
          SESSION_SECRET: ci-only-session-secret-0123456789abcdef
          ADMIN_PASSWORD: ci-only-admin-password
          DATABASE_URL: file:ci.db

  passed:
    name: CI passed
    if: always()
    needs: [static, unit, build]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
